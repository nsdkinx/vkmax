[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-max-client"
version = "1.0.2"
description = "Python client for MAX messenger (like user)"
readme = "README.md"
authors = [{name = "fedortimokhov", email = "huxuxuya@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["vk", "vkapi", "max-messenger", "vkmax", "oneme"]
dependencies = [
    "websockets"
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/huxuxuya/python-max-client.git"
Repository = "https://github.com/huxuxuya/python-max-client.git"
Original = "https://github.com/nsdkinx/vkmax"
News = "https://t.me/python_max_client"